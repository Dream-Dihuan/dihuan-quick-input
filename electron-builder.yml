appId: com.dihuan.quickinput
productName: Dihuan Quick Input
copyright: Copyright © 2026 Dihuan
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!tests/**'
  - '!extension/**'
  - '!scripts/**'
  - '!docs/**'
  - '!openspec/**'
  - '!dist-extension/**'
  - '!release/**'
  - '!test-results/**'
  - '!playwright-report/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.extension.json}'
  - '!{vitest.config.mts,playwright.config.ts}'
  - '!**/*.map'
asarUnpack:
  - resources/**
win:
  executableName: dihuan-quick-input
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Dihuan
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
